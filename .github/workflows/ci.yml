name: Web CI

# 网页仓（main）的门禁：只跑秒级的静态检查 + 纯逻辑测试，不发布、不碰数据。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22：原生支持 .js 里的 ESM 语法检查（--check 对 import 语句的处理
          # 在 18/20 上还有版本差异），与本地跑测试的版本保持一致
          node-version: "22"

      # APP_VER 与 sw.js 的 CACHE 必须一起加一；预缓存/引用清单里的文件必须存在
      - name: 版本与资源一致性
        run: bash scripts/check-version.sh

      # 当年节假日必须已配置：未配置时确认日会静默按周一至周五估算
      - name: 交易日历门禁
        run: node scripts/check-calendar.mjs

      # v98 · 静态索引健康软哨兵：快照过期 / 体积膨胀只提示，退出码恒 0。
      # 与 app.js 的 shelfFreshness() 共用同一判据（收口在 js/core/webank.js），
      # 不会两处口径分叉；不设硬阈值，避免 90 天后把每个 PR 染成假红。
      - name: 静态索引健康（软哨兵）
        run: node scripts/check-shelf-freshness.mjs

      # v100 · 债市晴雨表参考数据门禁：data/market.reference.json 必须过
      # js/core/market.js 的 validateMarket（与页面/测试同一个函数，不存在第二套判据）。
      # 校验失败 / 方向符号打架 / 禁用词命中 → 硬红；快照过期只软提示不阻断。
      - name: 债市参考数据门禁
        run: node scripts/check-market.mjs

      - name: 语法检查
        run: |
          node --check app.js
          node --check sw.js
          for f in js/core/*.js js/domain/*.js; do node --check "$f"; done

      # JSDoc + @ts-check 的类型校验（不打包、不产物，只做静态类型检查）
      - name: 类型检查（tsc --noEmit）
        run: |
          npm i --no-save --silent typescript@5.6.3
          npx tsc -p jsconfig.json

      # T+1 确认口径、净值序列、机构识别、截图 OCR 配对、内联事件桥契约、
      # 墓碑、整文件同步的合并语义（syncPush 不能删掉云端独有条目）、
      # 产品收益表的筛选与排序口径（v45）、同步状态的显示口径（v46：
      # 有改动待推时绝不许显示「已同步」——那等于放用户去卸载）、
      # 月报的逐日加总口径、底层配置与申赎规则的空值语义（v60）、
      # 债市晴雨表的整包校验与方向判据（v100）。
      # ★ 这份列表必须与 package.json 的 npm test 一致：漏一个文件，那条链路上的
      #   口径就只在本地被执行过，CI 全绿也不代表它没坏。monthly.test.mjs 是这次
      #   补上的——它早就在 npm test 里，却一直没进 CI，属于同一类漏洞。
      - name: 纯逻辑测试
        run: node --test tests/app_core.test.mjs tests/handlers.test.mjs tests/calendar.test.mjs tests/tomb.test.mjs tests/sync_merge.test.mjs tests/board.test.mjs tests/syncstatus.test.mjs tests/update.test.mjs tests/monthly.test.mjs tests/disc.test.mjs tests/analysis.test.mjs tests/advice.test.mjs tests/switchadv.test.mjs tests/llm.test.mjs tests/nav.test.mjs tests/webank.test.mjs tests/market.test.mjs tests/nativefetch.test.mjs tests/market-page.test.mjs tests/navstats.test.mjs tests/brief.test.mjs tests/report.test.mjs tests/pubcal.test.mjs tests/livebond.test.mjs tests/macro.test.mjs tests/news.test.mjs tests/websearch.test.mjs tests/anysearch.test.mjs tests/quota.test.mjs tests/redeem_v129.test.mjs
